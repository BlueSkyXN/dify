name: HFS runtime producer contract

on:
  pull_request:
    paths:
      - .github/scripts/align_hfs_runtime_dependency_assertions.py
      - .github/scripts/tests/test_align_hfs_runtime_dependency_assertions.py
      - .github/workflows/publish-hfs-runtime.yml
      - .github/workflows/hfs-runtime-producer-contract.yml
      - api/pyproject.toml
      - dify-agent/pyproject.toml
  push:
    branches: [main]
    paths:
      - .github/scripts/align_hfs_runtime_dependency_assertions.py
      - .github/scripts/tests/test_align_hfs_runtime_dependency_assertions.py
      - .github/workflows/publish-hfs-runtime.yml
      - .github/workflows/hfs-runtime-producer-contract.yml
      - api/pyproject.toml
      - dify-agent/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hfs-runtime-producer-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-consumer-pin:
    name: Validate immutable consumer pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout producer workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve and validate the immutable consumer pin
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-hfs-runtime.yml
          consumer_repository="$(sed -n 's/^  CONSUMER_REPOSITORY: //p' "$workflow")"
          consumer_commit="$(sed -n 's/^  CONSUMER_COMMIT: //p' "$workflow")"
          [[ "$consumer_repository" == BlueSkyXN/Dify-all-in-one-HFS ]]
          [[ "$consumer_commit" =~ ^[0-9a-f]{40}$ ]]

          git init --quiet consumer
          git -C consumer remote add origin "https://github.com/${consumer_repository}.git"
          git -C consumer fetch --quiet --depth=1 origin "$consumer_commit"
          git -C consumer checkout --quiet --detach FETCH_HEAD
          test "$(git -C consumer rev-parse HEAD)" = "$consumer_commit"
          test -f consumer/scripts/package-dify-runtime-artifact.py
          test -f consumer/docker/dify_artifact_contract.py
          test -f consumer/scripts/static-check.sh
          grep -Fq 'usr/local/share/nltk_data' consumer/scripts/package-dify-runtime-artifact.py
          grep -Fq 'punkt_tab' consumer/scripts/package-dify-runtime-artifact.py
          grep -Fq 'averaged_perceptron_tagger_eng' consumer/docker/dify_artifact_contract.py

      - name: Verify exact-image and NLTK producer bindings
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-hfs-runtime.yml
          grep -Fq "local tag=\"\${image}:sha-\${ARTIFACT_REF}\"" "$workflow"
          grep -Fq 'org.opencontainers.image.revision' "$workflow"
          grep -Fq "sed -n 's/^COMMIT_SHA=//p'" "$workflow"
          grep -Fq -- "--build-arg \"DIFY_API_IMAGE_REF=\$DIFY_API_IMAGE_REF\"" "$workflow"
          grep -Fq -- "--build-arg \"DIFY_WEB_IMAGE_REF=\$DIFY_WEB_IMAGE_REF\"" "$workflow"
          grep -Fq -- "--build-arg \"DIFY_AGENT_IMAGE_REF=\$DIFY_AGENT_IMAGE_REF\"" "$workflow"
          grep -Fq -- "--build-arg \"DIFY_AGENT_RUNTIME_IMAGE_REF=\$DIFY_AGENT_RUNTIME_IMAGE_REF\"" "$workflow"
          grep -Fq 'api_container:/usr/local/share/nltk_data' "$workflow"

      - name: Verify retained runtime build alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s .github/scripts/tests \
            -p 'test_align_hfs_runtime_dependency_assertions.py'

          workflow=.github/workflows/publish-hfs-runtime.yml
          legacy_build_commit="$(sed -n 's/^  LEGACY_BUILD_COMMIT: //p' "$workflow")"
          [[ "$legacy_build_commit" =~ ^[0-9a-f]{40}$ ]]
          grep -Fq 'python3 producer-source/.github/scripts/align_hfs_runtime_dependency_assertions.py' "$workflow"

          git init --quiet legacy-wrapper
          git -C legacy-wrapper remote add origin https://github.com/BlueSkyXN/Dify-all-in-one-HFS.git
          git -C legacy-wrapper fetch --quiet --depth=1 origin "$legacy_build_commit"
          git -C legacy-wrapper checkout --quiet --detach FETCH_HEAD
          test "$(git -C legacy-wrapper rev-parse HEAD)" = "$legacy_build_commit"
          python3 .github/scripts/align_hfs_runtime_dependency_assertions.py \
            --dockerfile legacy-wrapper/Dockerfile \
            --api-pyproject api/pyproject.toml \
            --agent-pyproject dify-agent/pyproject.toml
          test "$(grep -Fc 'ENV PYTHONDONTWRITEBYTECODE=1' legacy-wrapper/Dockerfile)" -eq 1
          git -C legacy-wrapper diff --check

      - name: Verify exact-main and atomic Release safety
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish-hfs-runtime.yml
          grep -Fq "github.repository == 'BlueSkyXN/dify'" "$workflow"
          grep -Fq "github.ref == 'refs/heads/main'" "$workflow"
          grep -Fq 'group: dify-hfs-runtime-release-' "$workflow"
          grep -Fq "test \"\$GITHUB_SHA\" = \"\$ARTIFACT_REF\"" "$workflow"
          grep -Fq "git -C producer-source merge-base --is-ancestor \"\$DIFY_UPSTREAM_BASE_REF\" \"\$ARTIFACT_REF\"" "$workflow"
          grep -Fq "\"refs/tags/\$RELEASE_TAG^{}\"" "$workflow"
          grep -Fq -- '--verify-tag' "$workflow"
          grep -Fq -- '--latest=false' "$workflow"
          if grep -Fq 'gh release upload' "$workflow"; then
            echo "producer must not publish a Release before all assets are attached" >&2
            exit 1
          fi
          python3 - "$workflow" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          start = text.index('create_args=(')
          end = text.index('gh release create "${create_args[@]}"', start)
          release = text[start:end]
          ordered = (
              '"$OUTPUT_DIR/$artifact"',
              '"$OUTPUT_DIR/SHA256SUMS.txt"',
              '"$OUTPUT_DIR/manifest.json"',
          )
          positions = [release.index(value) for value in ordered]
          if positions != sorted(positions):
              raise SystemExit("Release assets must be created artifact/checksum/manifest-last")
          PY

      - name: Run the selected consumer contract
        working-directory: consumer
        shell: bash
        run: bash scripts/static-check.sh

      - name: Verify producer workflow diff hygiene
        shell: bash
        run: git diff --check
