name: Publish HFS runtime archive

on:
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: Exact BlueSkyXN/dify main commit represented by the runtime archive
        required: true
        type: string
      release_tag:
        description: New or existing immutable GitHub Release tag for this runtime
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH_DIFY_HFS_RUNTIME to authorize the Release write
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  produce:
    permissions:
      contents: write
      packages: read
    uses: BlueSkyXN/Dify-all-in-one-HFS/.github/workflows/produce-dify-runtime.yml@cac801bda64a998b1ae01c0469311eb2ff001f16
    with:
      artifact_ref: ${{ inputs.artifact_ref }}
      release_tag: ${{ inputs.release_tag }}
      confirm_publish: ${{ inputs.confirm_publish }}
      source_repository: BlueSkyXN/dify
      upstream_base_ref: 0fc01fee3faff6c8dc71161f5f3dee90e808a9aa
      contract_ref: cac801bda64a998b1ae01c0469311eb2ff001f16
